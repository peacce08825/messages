<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자연스러운 영어 답장 생성기</title>
    <style>
        :root {
            --primary: #4F46E5;
            --bg: #F3F4F6;
            --card-bg: #FFFFFF;
            --text-main: #1F2937;
            --text-muted: #6B7280;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            line-height: 1.5;
        }
        h2 { text-align: center; color: var(--primary); }
        .config-box {
            background: #e0e7ff;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.9em;
        }
        .config-box input { width: 100%; margin-top: 5px; box-sizing: border-box;}
        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
        }
        textarea, input {
            width: 100%;
            padding: 10px;
            border: 1px solid #D1D5DB;
            border-radius: 8px;
            box-sizing: border-box;
            font-family: inherit;
        }
        textarea { height: 100px; resize: vertical; }
        button {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover { background-color: #4338CA; }
        button:disabled { background-color: #9CA3AF; cursor: not-allowed; }
        #results { margin-top: 20px; }
        .reply-option {
            background: #F9FAFB;
            border-left: 4px solid var(--primary);
            padding: 12px 16px;
            margin-bottom: 12px;
            border-radius: 4px;
            position: relative;
        }
        .copy-btn {
            position: absolute;
            right: 10px;
            top: 10px;
            background: #E5E7EB;
            color: var(--text-main);
            padding: 4px 8px;
            font-size: 12px;
            border-radius: 4px;
            width: auto;
        }
        .loading { display: none; text-align: center; color: var(--text-muted); margin: 10px 0; }
    </style>
</head>
<body>

    <h2>💬 EngReply Maker</h2>

    <div class="config-box">
        <label for="apiKey">Gemini API Key (최초 1회 입력)</label>
        <input type="password" id="apiKey" placeholder="AI-...">
        <div style="color: #6B7280; font-size: 12px; margin-top: 4px;">* 키는 브라우저에만 저장되며 서버로 전송되지 않습니다.</div>
    </div>

    <div class="card">
        <div style="margin-bottom: 16px;">
            <label for="context">1. 현재 상황/맥락 (한국어 작성)</label>
            <textarea id="context" placeholder="예: 금요일에 만나서 과제하자고 했는데, 내가 금요일에 약속이 있어서 토요일로 미루고 싶어."></textarea>
        </div>
        
        <div>
            <label for="lastMessage">2. 마지막으로 받은 영어 답장 (복붙)</label>
            <textarea id="lastMessage" placeholder="예: Hey, are we still meeting this Friday for the project?"></textarea>
        </div>
    </div>

    <button id="generateBtn" onclick="generateReplies()">추천 답안 뽑기</button>
    <div id="loading" class="loading">자연스러운 답변을 고민 중입니다... 🤔</div>

    <div id="results"></div>

    <script>
        // 로컬 스토리지에서 API 키 불러오기
        document.addEventListener("DOMContentLoaded", () => {
            const savedKey = localStorage.getItem('geminiApiKey');
            if (savedKey) document.getElementById('apiKey').value = savedKey;
        });

        async function generateReplies() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const context = document.getElementById('context').value.trim();
            const lastMessage = document.getElementById('lastMessage').value.trim();

            if (!apiKey) {
                alert("Gemini API Key를 입력해주세요.");
                return;
            }
            if (!context || !lastMessage) {
                alert("맥락과 마지막 메시지를 모두 입력해주세요.");
                return;
            }

            // API 키 저장
            localStorage.setItem('geminiApiKey', apiKey);

            const btn = document.getElementById('generateBtn');
            const loading = document.getElementById('loading');
            const resultsDiv = document.getElementById('results');

            btn.disabled = true;
            loading.style.display = 'block';
            resultsDiv.innerHTML = '';

            const prompt = `
            You are helping a young adult text back in English. 
            Context (Korean): ${context}
            Last message received (English): ${lastMessage}
            
            Generate 3 different text message replies. 
            Rules:
            1. DO NOT sound like a textbook or formal email. Use casual, natural everyday texting language.
            2. It shouldn't be overly enthusiastic (not too much), just a normal, friendly tone.
            3. Use natural abbreviations if appropriate (e.g., 'lmk', 'rn', 'tbh', 'def') but don't overdo it.
            4. Provide ONLY a JSON array of 3 strings. Example: ["reply 1", "reply 2", "reply 3"]
            `;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }]
                    })
                });

                if (!response.ok) throw new Error("API Request Failed");

                const data = await response.json();
                let textResult = data.candidates[0].content.parts[0].text;
                
                // 마크다운 백틱 제거 및 JSON 파싱
                textResult = textResult.replace(/```json/g, '').replace(/```/g, '').trim();
                const replies = JSON.parse(textResult);

                replies.forEach((reply, index) => {
                    resultsDiv.innerHTML += `
                        <div class="reply-option">
                            <button class="copy-btn" onclick="copyText(this, '${reply.replace(/'/g, "\\'")}')">복사</button>
                            <strong>Option ${index + 1}:</strong><br><br>${reply}
                        </div>
                    `;
                });

            } catch (error) {
                console.error(error);
                resultsDiv.innerHTML = `<div style="color: red;">오류가 발생했습니다. API 키가 유효한지 확인해주세요.</div>`;
            } finally {
                btn.disabled = false;
                loading.style.display = 'none';
            }
        }

        function copyText(btnElement, text) {
            navigator.clipboard.writeText(text).then(() => {
                const originalText = btnElement.innerText;
                btnElement.innerText = "복사 완료!";
                setTimeout(() => { btnElement.innerText = originalText; }, 2000);
            });
        }
    </script>
</body>
</html>
