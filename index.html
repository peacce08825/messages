<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자연스러운 영어 답장 생성기</title>

    <!-- 브라우저 탭 favicon -->
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
    <link rel="icon" href="favicon-16.png" sizes="16x16" type="image/png">

    <!-- iOS 홈 화면 아이콘 (iOS는 SVG를 지원하지 않아 PNG로 지정해야 함) -->
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="EngReply">

    <!-- Android/Chrome 홈 화면 아이콘 -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4F46E5">
    <style>
        :root {
            --primary: #4F46E5;
            --bg: #F3F4F6;
            --card-bg: #FFFFFF;
            --text-main: #1F2937;
            --text-muted: #6B7280;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            line-height: 1.5;
        }
        h2 { text-align: center; color: var(--primary); }
        details {
            background: #e0e7ff;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.9em;
        }
        summary {
            font-weight: 600;
            cursor: pointer;
            outline: none;
        }
        .config-box input { width: 100%; margin-top: 10px; padding: 8px; border-radius: 4px; border: 1px solid #D1D5DB; box-sizing: border-box;}
        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }
        .mode-selector {
            display: flex;
            gap: 15px;
            margin-bottom: 16px;
            padding-bottom: 16px;
            border-bottom: 1px solid #E5E7EB;
        }
        .mode-selector label {
            font-weight: normal;
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
        }
        textarea, input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #D1D5DB;
            border-radius: 8px;
            box-sizing: border-box;
            font-family: inherit;
        }
        textarea { height: 80px; resize: vertical; }
        .input-group { margin-bottom: 16px; }
        button {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover { background-color: #4338CA; }
        button:disabled { background-color: #9CA3AF; cursor: not-allowed; }
        #results { margin-top: 20px; }
        .reply-option {
            background: #F9FAFB;
            border-left: 4px solid var(--primary);
            padding: 12px 16px;
            margin-bottom: 12px;
            border-radius: 4px;
            position: relative;
        }
        .copy-btn {
            position: absolute;
            right: 10px;
            top: 10px;
            background: #E5E7EB;
            color: var(--text-main);
            padding: 4px 8px;
            font-size: 12px;
            border-radius: 4px;
            width: auto;
        }
        .loading { display: none; text-align: center; color: var(--text-muted); margin: 10px 0; }
    </style>
</head>
<body>

    <h2>💬 EngReply Maker</h2>

    <!-- 접었다 펼 수 있는 사이드바 형태의 설정창 -->
    <details class="config-box">
        <summary>⚙️ API 키 설정 (최초 1회 입력)</summary>
        <input type="password" id="apiKey" placeholder="AI-...">
        <div style="color: #6B7280; font-size: 12px; margin-top: 4px;">* 키는 브라우저에만 저장되며 서버로 전송되지 않습니다.</div>
    </details>

    <div class="card">
        <div class="mode-selector">
            <label><input type="radio" name="mode" value="auto" checked onchange="toggleMode()"> 상황 추천</label>
            <label><input type="radio" name="mode" value="translate" onchange="toggleMode()"> 내 답변 번역</label>
        </div>

        <div class="input-group">
            <label for="lastMessage">상대방의 마지막 메시지 (영어)</label>
            <textarea id="lastMessage" placeholder="예: Hey, are we still meeting this Friday?"></textarea>
        </div>

        <div class="input-group" id="autoSection">
            <label for="context">현재 상황/맥락 (한국어)</label>
            <textarea id="context" placeholder="예: 금요일에 약속이 있어서 토요일로 미루고 싶어."></textarea>
        </div>

        <div class="input-group" id="translateSection" style="display: none;">
            <label for="myReply">내가 보낼 답장 (한국어)</label>
            <textarea id="myReply" placeholder="예: 미안해 ㅠㅠ 나 금요일에 갑자기 일이 생겨서 그런데 혹시 토요일도 괜찮아?"></textarea>
        </div>
    </div>

    <button id="generateBtn" onclick="generateReplies()">추천 답안 뽑기</button>
    <div id="loading" class="loading">자연스러운 답변을 고민 중입니다... 🤔</div>

    <div id="results"></div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const savedKey = localStorage.getItem('geminiApiKey');
            if (savedKey) document.getElementById('apiKey').value = savedKey;
        });

        function toggleMode() {
            const mode = document.querySelector('input[name="mode"]:checked').value;
            document.getElementById('autoSection').style.display = mode === 'auto' ? 'block' : 'none';
            document.getElementById('translateSection').style.display = mode === 'translate' ? 'block' : 'none';
        }

        async function generateReplies() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const mode = document.querySelector('input[name="mode"]:checked').value;
            const lastMessage = document.getElementById('lastMessage').value.trim();
            const context = document.getElementById('context').value.trim();
            const myReply = document.getElementById('myReply').value.trim();

            if (!apiKey) return alert("Gemini API Key를 설정창에 입력해주세요.");
            if (!lastMessage) return alert("상대방의 마지막 메시지를 입력해주세요.");
            if (mode === 'auto' && !context) return alert("상황을 입력해주세요.");
            if (mode === 'translate' && !myReply) return alert("보낼 답장을 한국어로 입력해주세요.");

            localStorage.setItem('geminiApiKey', apiKey);

            const btn = document.getElementById('generateBtn');
            const loading = document.getElementById('loading');
            const resultsDiv = document.getElementById('results');

            btn.disabled = true;
            loading.textContent = '자연스러운 답변을 고민 중입니다... 🤔';
            loading.style.display = 'block';
            resultsDiv.innerHTML = '';

            let promptContext = mode === 'auto' 
                ? `Context (Korean): ${context}` 
                : `User's exact intended reply (Korean): ${myReply}`;

            let instruction = mode === 'auto'
                ? `Generate 3 different natural text message replies based on the context.`
                : `Translate and polish the user's intended Korean reply into 3 different natural English text message options, keeping the original meaning but adapting it to texting culture.`;

            const prompt = `
            You are helping a young adult text back in English. 
            Last message received (English): ${lastMessage}
            ${promptContext}
            
            ${instruction}
            
            Rules:
            1. DO NOT sound like a textbook or formal email. Use casual, natural everyday texting language.
            2. It shouldn't be overly enthusiastic, just a normal, friendly tone.
            3. Use natural abbreviations if appropriate (e.g., 'lmk', 'rn', 'tbh') but don't overdo it.
            4. Provide ONLY a JSON array of 3 strings. Example: ["reply 1", "reply 2", "reply 3"]
            `;

            const MODEL = 'gemini-2.5-flash';
            const MAX_RETRIES = 3;

            async function callGemini(retryCount) {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-goog-api-key': apiKey
                    },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });

                if (response.status === 503 && retryCount < MAX_RETRIES) {
                    loading.textContent = `모델이 혼잡해서 다시 시도 중입니다... (${retryCount + 1}/${MAX_RETRIES}) 🔄`;
                    const waitMs = 1000 * Math.pow(2, retryCount); // 1s, 2s, 4s
                    await new Promise(res => setTimeout(res, waitMs));
                    return callGemini(retryCount + 1);
                }

                if (!response.ok) {
                    const errBody = await response.json().catch(() => null);
                    const msg = errBody?.error?.message || `HTTP ${response.status}`;
                    throw new Error(msg);
                }

                return response.json();
            }

            try {
                const data = await callGemini(0);
                let textResult = data.candidates[0].content.parts[0].text;
                
                textResult = textResult.replace(/```json/g, '').replace(/```/g, '').trim();
                const replies = JSON.parse(textResult);

                replies.forEach((reply, index) => {
                    resultsDiv.innerHTML += `
                        <div class="reply-option">
                            <button class="copy-btn" onclick="copyText(this, '${reply.replace(/'/g, "\\'")}')">복사</button>
                            <strong>Option ${index + 1}:</strong><br><br>${reply}
                        </div>
                    `;
                });
            } catch (error) {
                console.error(error);
                resultsDiv.innerHTML = `<div style="color: red;">오류가 발생했습니다: ${error.message}</div>`;
            } finally {
                btn.disabled = false;
                loading.style.display = 'none';
            }
        }

        function copyText(btnElement, text) {
            navigator.clipboard.writeText(text).then(() => {
                const originalText = btnElement.innerText;
                btnElement.innerText = "복사 완료!";
                setTimeout(() => { btnElement.innerText = originalText; }, 2000);
            });
        }
    </script>
</body>
</html>
